# Plain static site: no build step. Netlify publishes this folder as it is.
[build]
  publish = "."

# Make phones pick up new versions quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
